<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Valentine Special</title>
<style>
  body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(#ffd6e7,#fff);
    overflow-x:hidden;
    text-align:center;
  }
  h1{color:#ff2e63;margin-top:40px}
  .card{
    background:white;
    max-width:420px;
    margin:20px auto;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
  }
  button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    margin:8px;
  }
  .yes{background:#ff4d6d;color:white}
  .no{background:#ddd}
  #heartRain span{
    position:fixed;
    top:-10px;
    font-size:20px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh);opacity:0}
  }
  #game{
    position:relative;
    height:220px;
    border:2px dashed #ff4d6d;
    border-radius:15px;
    overflow:hidden;
    margin-top:15px;
  }
  .target{
    position:absolute;
    font-size:26px;
    cursor:pointer;
  }
</style>
</head>
<body>

<h1>Happy Valentine ❤️</h1>

<div class="card">
  <h2>Pesan Untuk Kamu</h2>
  <p>Aku cuma mau bilang...
  <br><b>Kamu itu spesial banget buat aku 💖</b></p>
</div>

<div class="card">
  <h2>Will you be my Valentine?</h2>
  <button class="yes" onclick="accepted()">Yes 💕</button>
  <button class="no" id="noBtn">No 😢</button>
  <p id="answer"></p>
</div>

<div class="card">
  <h2>Mini Game: Tangkap Hati!</h2>
  <p>Score: <span id="score">0</span></p>
  <div id="game"></div>
</div>

<div id="heartRain"></div>

<script>
// tombol kabur
const noBtn=document.getElementById('noBtn');
noBtn.addEventListener('mouseover',()=>{
  noBtn.style.position='absolute';
  noBtn.style.left=Math.random()*80+'%';
  noBtn.style.top=Math.random()*80+'%';
});

function accepted(){
  document.getElementById('answer').innerHTML='Yay! Aku juga sayang kamu 💞';
  heartRain(40);
}

// hujan hati
function heartRain(total){
  for(let i=0;i<total;i++){
    let heart=document.createElement('span');
    heart.innerHTML='❤️';
    heart.style.left=Math.random()*100+'vw';
    heart.style.animationDuration=(Math.random()*2+3)+'s';
    document.getElementById('heartRain').appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
  }
}

// mini game
let score=0;
const game=document.getElementById('game');

function spawnHeart(){
  const heart=document.createElement('div');
  heart.className='target';
  heart.innerHTML='💗';
  heart.style.left=Math.random()*90+'%';
  heart.style.top=Math.random()*80+'%';
  heart.onclick=()=>{
    score++;
    document.getElementById('score').innerText=score;
    heart.remove();
    heartRain(5);
  }
  game.appendChild(heart);
  setTimeout(()=>heart.remove(),1200);
}
setInterval(spawnHeart,900);
</script>

</body>
</html>
