<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ffe6f0, #ffd6ec);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        position: relative;
    }

    h1 {
        color: #e91e63;
        margin-bottom: 15px;
    }

    img {
        width: 180px;
        margin-bottom: 15px;
        border-radius: 12px;
    }

    .buttons {
        margin-top: 20px;
        position: relative;
        height: 60px;
    }

    button {
        padding: 12px 25px;
        font-size: 16px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        position: absolute;
        transition: 0.3s ease;
    }

    #yesBtn {
        background: #e91e63;
        color: white;
        left: 30%;
    }

    #noBtn {
        background: #ccc;
        left: 55%;
    }

    button:hover {
        transform: scale(1.1);
    }

    .heart {
        position: absolute;
        bottom: -20px;
        color: #ff4d88;
        animation: floatUp 5s linear infinite;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-100vh); opacity: 0; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Will You Be My Valentine? ❤️</h1>

    <!-- GANTI GIF DI SINI -->
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute">

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">YES 💖</button>
        <button id="noBtn">NO 😢</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

function sayYes() {
    document.body.innerHTML = `
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;font-family:Arial;">
            <h1 style="color:#e91e63;">YAYYY ❤️</h1>
            <p>Aku senang banget kamu pilih YES 😍</p>
        </div>
    `;
    startHearts();
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 20 + "px";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 5000);
    }, 300);
}
</script>

</body>
</html>
